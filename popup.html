<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --toggle-off: #cbd5e1;
            --toggle-on: #15428b;
            --focus-ring: #15428b;
            --btn-primary: #15428b;
            --btn-primary-hover: #0c2c62;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 320px;
            padding: 16px;
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-version {
            font-size: 10px;
            font-weight: 600;
            background: #e2e8f0;
            color: #475569;
            padding: 2px 6px;
            border-radius: 99px;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            padding: 11px 13px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            margin-bottom: 10px;
        }

        .control-group.vertical {
            flex-direction: column;
            align-items: stretch;
            gap: 7px;
        }

        .label { 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--text-main);
        }

        .select-input {
            width: 100%;
            padding: 7px 9px;
            font-size: 12px;
            font-family: inherit;
            color: var(--text-main);
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .select-input:focus {
            border-color: var(--focus-ring);
        }

        .text-input {
            width: 60px;
            padding: 5px 8px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            color: var(--text-main);
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
        }

        .text-input:focus {
            border-color: var(--focus-ring);
        }

        .btn-action {
            width: 100%;
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            background-color: var(--btn-primary);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 1px 3px rgba(16, 185, 129, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-action:hover {
            background-color: var(--btn-primary-hover);
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        /* Toggle Switch */
        .switch { 
            position: relative; 
            display: inline-block; 
            width: 36px; 
            height: 20px; 
            flex-shrink: 0;
        }

        .switch input { 
            opacity: 0; 
            width: 0; 
            height: 0; 
            margin: 0;
        }

        .slider { 
            position: absolute; 
            cursor: pointer; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background-color: var(--toggle-off); 
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            border-radius: 99px; 
        }

        .slider:before { 
            position: absolute; 
            content: ""; 
            height: 16px; 
            width: 16px; 
            left: 2px; 
            bottom: 2px; 
            background-color: #fff; 
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            border-radius: 50%; 
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        input:checked + .slider { 
            background-color: var(--toggle-on); 
        }

        input:checked + .slider:before { 
            transform: translateX(16px); 
        }

        /* Botões secundários e de perigo */
        .btn-secundario {
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }
        .btn-secundario:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        .btn-perigo {
            background-color: #dc2626;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .btn-perigo:hover {
            background-color: #b91c1c;
        }

        /* Cards da Lista de OPs Bloqueadas por MRP */
        .card-op-bloqueada {
            background-color: #fff5f5;
            border: 1px solid #fecaca;
            border-radius: 6px;
            padding: 7px 9px;
            margin-bottom: 6px;
            box-sizing: border-box;
            transition: border-color 0.15s, background-color 0.15s;
        }
        .card-op-bloqueada:hover {
            border-color: #fca5a5;
            background-color: #fef2f2;
        }
        .op-tag-orp {
            font-size: 11px;
            font-weight: 700;
            color: #991b1b;
            background: #fee2e2;
            padding: 1px 5px;
            border-radius: 4px;
        }
        .op-tag-item {
            font-size: 10px;
            font-weight: 600;
            color: #475569;
            background: #e2e8f0;
            padding: 1px 4px;
            border-radius: 4px;
            margin-left: 4px;
        }
        .op-produto-titulo {
            font-size: 11px;
            font-weight: 600;
            color: #1e293b;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .op-detalhes-sub {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: #64748b;
            margin-top: 3px;
        }
        .btn-desbloquear-item {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            color: #15428b;
            padding: 2px 6px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-desbloquear-item:hover {
            background: #15428b;
            color: #ffffff;
            border-color: #15428b;
        }

        #containerListaMRP::-webkit-scrollbar {
            width: 5px;
        }
        #containerListaMRP::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 99px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>ERP Optimizer PRO</h3>
        <span class="badge-version">v1.3</span>
    </div>
    
    <div class="control-group">
        <span class="label">Modo Liberação de OP</span>
        <label class="switch">
            <input type="checkbox" id="toggleLiberacao">
            <span class="slider"></span>
        </label>
    </div>

    <div class="control-group">
        <span class="label">Bloquear Refresh Automático</span>
        <label class="switch">
            <input type="checkbox" id="toggleBloquearAutoRefresh">
            <span class="slider"></span>
        </label>
    </div>

    <div class="control-group vertical">
        <label class="label" for="selectOrdenacao">Ordenar por Data de Movimentação</label>
        <select id="selectOrdenacao" class="select-input">
            <option value="padrao">Padrão do Sistema</option>
            <option value="desc">Mais recente primeiro (Decrescente)</option>
            <option value="asc">Mais antigo primeiro (Crescente)</option>
        </select>
    </div>

    <div class="control-group">
        <span class="label">Motivo Padrão de Baixa</span>
        <input type="text" id="inputMotivoPadrao" class="text-input" value="55" maxlength="10">
    </div>

    <div class="control-group vertical" id="grupoBloqueadasMRP">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div>
                <span class="label" style="display: flex; align-items: center; gap: 5px; color: #b91c1c;">
                    <span>🚫</span> Bloqueadas no MRP
                </span>
                <span style="font-size: 11px; color: var(--text-muted);" id="lblContadorMRP">0 ocultadas</span>
            </div>
            <div style="display: flex; gap: 6px;">
                <button type="button" id="btnVerMRP" class="btn-secundario">
                    Ver Lista
                </button>
                <button type="button" id="btnLimparMRP" class="btn-perigo">
                    Limpar
                </button>
            </div>
        </div>

        <div id="containerListaMRP" style="display: none; max-height: 220px; overflow-y: auto; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color);">
            <!-- Lista de cards renderizada via JS -->
        </div>
    </div>

    <div style="margin-top: 14px;">
        <button id="btnFinalizarSelecionadasPopup" class="btn-action">
            Finalizar Selecionadas em Lote
        </button>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
